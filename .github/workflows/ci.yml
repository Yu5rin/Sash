# main への push とプルリクエストで、UI と .NET のビルド・テストを実行し、試用の exe を成果物に残す。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ビルドとテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: .NET SDK の準備
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Node.js の準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI のテストとビルド
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

      # 古い WebView2（Chromium 109〜）で背景色が消えないよう、変換漏れの CSS が出力に残っていないことを確かめる（docs/SPEC.md §3）。
      # Monaco の CSS も含め、wwwroot/assets の CSS すべてを対象にする。
      - name: CSS の互換性の検査
        run: |
          if grep -nE 'light-dark\(|color-mix\(' src/Sash.App/wwwroot/assets/*.css; then
            echo "::error::ビルド後の CSS に light-dark() / color-mix() が残っています（Chromium 109 で無効になります）"
            exit 1
          fi

      - name: .NET のビルド
        run: dotnet build Sash.slnx -c Release

      - name: テスト
        run: dotnet test Sash.slnx -c Release --no-build

      # 試用の単一 exe（Windows 向け。Linux 上でも発行できる）。リリースには使わない
      - name: 単一 exe の発行
        run: dotnet publish src/Sash.App -p:PublishProfile=win-x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sash-win-x64
          path: artifacts/publish/win-x64/Sash.exe
