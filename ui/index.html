<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data:" />
    <title>Sash</title>
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <span class="brand">Sash</span>
        <span id="file-name" class="file-name">ファイルが開かれていません</span>
        <span class="spacer"></span>
        <button id="btn-open" type="button">開く</button>
        <button id="btn-save" type="button" disabled>保存</button>
        <button id="btn-apply" type="button" class="primary" disabled title="Excelへ反映 (F5)">反映 F5</button>
      </header>

      <aside class="pane left">
        <section class="palette">
          <h2>パレット</h2>
          <ul id="palette-list"></ul>
        </section>
        <section class="tree">
          <h2>ツリー</h2>
          <ul id="tree"></ul>
        </section>
      </aside>

      <main class="pane center">
        <section class="canvas">
          <div id="canvas"></div>
        </section>
        <section class="xml">
          <div class="xml-status" id="xml-status" hidden>同期停止中：XMLの構文を直すと再開します</div>
          <div id="xml-editor"></div>
        </section>
      </main>

      <aside class="pane right">
        <h2>インスペクタ</h2>
        <div id="inspector" class="empty">要素を選択してください</div>
      </aside>

      <footer class="bottom">
        <span id="status-problems">問題 0</span>
        <span>・</span>
        <span id="status-callbacks">コールバック 0</span>
        <span>・</span>
        <span id="status-images">アイコン 0</span>
        <span class="spacer"></span>
        <span id="status-message"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
