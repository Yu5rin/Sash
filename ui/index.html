<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data:" />
    <title>Sash</title>
    <link rel="icon" type="image/png" href="/sash-icon.png" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <!-- アイコンと「Sash」は Windows のタイトルバーに出るので、ここには置かない（二重に並ぶため） -->
        <div id="menubar"></div>
        <div class="title-center">
          <span id="file-chip" class="file-chip" hidden>
            <span class="file-chip-name" id="file-name"></span>
            <span class="file-chip-dirty" id="file-dirty" hidden></span>
          </span>
          <span id="excel-chip" class="excel-chip" hidden></span>
          <span id="vba-chip" class="excel-chip vba-chip" hidden></span>
          <select id="part-switch" class="compact" hidden title="編集するパーツ（2010以降の Excel は customUI14 を優先します）" data-i18n-title="編集するパーツ（2010以降の Excel は customUI14 を優先します）" aria-label="編集するパーツ（2010以降の Excel は customUI14 を優先します）"></select>
        </div>
        <button id="update-banner" type="button" class="update-banner" hidden></button>
      </header>

      <div id="toolbar" class="toolbar" role="toolbar" aria-label="ツールバー">
        <button id="btn-open" type="button" class="tb-button"></button>
        <button id="btn-save" type="button" class="tb-button" disabled></button>
        <span class="tb-sep" role="separator"></span>
        <button id="btn-undo" type="button" class="tb-button icon-only" disabled></button>
        <button id="btn-redo" type="button" class="tb-button icon-only" disabled></button>
        <span class="tb-sep" role="separator"></span>
        <button id="btn-command" type="button" class="tb-button subtle"></button>
        <button id="btn-dist" type="button" class="tb-button subtle" disabled></button>
        <span class="tb-spacer"></span>
        <button id="btn-apply" type="button" class="tb-button excel" disabled></button>
      </div>

      <aside class="pane left" aria-label="パレットとツリー">
        <section class="palette" data-pane="palette" aria-labelledby="palette-heading">
          <h2 id="palette-heading" class="pane-title"><button type="button" class="pane-toggle" data-split-toggle="palette" aria-expanded="true" aria-controls="palette" data-i18n="パレット">パレット</button></h2>
          <div id="palette" class="palette-body"></div>
        </section>
        <div class="splitter h" data-splitter="palette" role="separator" aria-orientation="horizontal" aria-label="パレットとツリーの高さ" tabindex="0" title="ドラッグで高さを変更、ダブルクリックで既定の比率に戻す" data-i18n-title="ドラッグで高さを変更、ダブルクリックで既定の比率に戻す"></div>
        <section class="tree-pane" aria-labelledby="tree-heading">
          <h2 id="tree-heading" class="pane-title"><button type="button" class="pane-toggle" data-split-toggle="tree" aria-expanded="true" aria-controls="tree" data-i18n="ツリー">ツリー</button></h2>
          <div id="tree" role="tree" aria-label="ツリー" data-pane="tree"></div>
        </section>
      </aside>
      <div class="splitter v" data-splitter="left" style="grid-area: sl" aria-label="パレットとツリーの幅" title="ドラッグで幅を変更、ダブルクリックで畳む" data-i18n-title="ドラッグで幅を変更、ダブルクリックで畳む"></div>

      <main class="pane center">
        <section class="canvas-pane" aria-label="キャンバス">
          <div id="canvas" tabindex="0" data-pane="canvas" aria-label="キャンバス"></div>
        </section>
        <div class="splitter h" data-splitter="top" aria-label="キャンバスの高さ" title="ドラッグで高さを変更、ダブルクリックで畳む" data-i18n-title="ドラッグで高さを変更、ダブルクリックで畳む"></div>
        <section class="xml-pane" aria-label="XML エディタ（F6 で次のペインへ）" data-pane="xml">
          <div class="xml-status" id="xml-status" hidden></div>
          <div id="xml-editor"></div>
        </section>
      </main>

      <div class="splitter v" data-splitter="right" style="grid-area: sr" aria-label="インスペクタの幅" title="ドラッグで幅を変更、ダブルクリックで畳む" data-i18n-title="ドラッグで幅を変更、ダブルクリックで畳む"></div>
      <aside class="pane right" aria-labelledby="inspector-heading">
        <h2 id="inspector-heading" class="pane-title" data-i18n="インスペクタ">インスペクタ</h2>
        <div id="inspector" tabindex="-1" data-pane="inspector"></div>
      </aside>

      <div class="splitter h" data-splitter="bottom" style="grid-area: sb" aria-label="下部パネルの高さ" title="ドラッグで高さを変更、ダブルクリックで畳む" data-i18n-title="ドラッグで高さを変更、ダブルクリックで畳む"></div>
      <footer class="bottom" data-pane="bottom">
        <div id="bottom-tabs" class="bottom-tabs" role="tablist"></div>
        <div id="bottom-body" class="bottom-body" role="tabpanel" tabindex="-1"></div>
      </footer>

      <div id="home" class="home"></div>
    </div>
    <div id="toasts" class="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
